<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background: gravel/path surface -->
  <rect width="800" height="600" fill="#c8b89a"/>
  <!-- Gravel texture dots -->
  <g fill="#b8a88a" opacity="0.6">
    <circle cx="30" cy="20" r="2"/><circle cx="75" cy="45" r="1.5"/><circle cx="120" cy="15" r="2"/>
    <circle cx="160" cy="35" r="1.5"/><circle cx="200" cy="10" r="2"/><circle cx="250" cy="50" r="1.5"/>
    <circle cx="300" cy="20" r="2"/><circle cx="350" cy="40" r="1.5"/><circle cx="400" cy="15" r="2"/>
    <circle cx="450" cy="30" r="2"/><circle cx="500" cy="50" r="1.5"/><circle cx="550" cy="20" r="2"/>
    <circle cx="600" cy="40" r="1.5"/><circle cx="650" cy="10" r="2"/><circle cx="700" cy="35" r="2"/>
    <circle cx="750" cy="50" r="1.5"/><circle cx="780" cy="20" r="2"/>
    <circle cx="40" cy="580" r="2"/><circle cx="100" cy="560" r="1.5"/><circle cx="180" cy="575" r="2"/>
    <circle cx="260" cy="555" r="1.5"/><circle cx="340" cy="580" r="2"/><circle cx="420" cy="560" r="2"/>
    <circle cx="500" cy="575" r="1.5"/><circle cx="580" cy="555" r="2"/><circle cx="660" cy="580" r="1.5"/>
    <circle cx="740" cy="560" r="2"/><circle cx="790" cy="575" r="1.5"/>
  </g>

  <!-- Outer border wall -->
  <rect x="10" y="10" width="780" height="580" fill="none" stroke="#8b7355" stroke-width="6" rx="4"/>

  <!-- ── Patch A: top-left ── -->
  <rect x="40" y="40" width="320" height="230" fill="#5a8a3c" rx="3"/>
  <!-- Soil rows -->
  <g stroke="#4a7a2c" stroke-width="1.5" opacity="0.5">
    <line x1="40" y1="65" x2="360" y2="65"/>
    <line x1="40" y1="90" x2="360" y2="90"/>
    <line x1="40" y1="115" x2="360" y2="115"/>
    <line x1="40" y1="140" x2="360" y2="140"/>
    <line x1="40" y1="165" x2="360" y2="165"/>
    <line x1="40" y1="190" x2="360" y2="190"/>
    <line x1="40" y1="215" x2="360" y2="215"/>
    <line x1="40" y1="240" x2="360" y2="240"/>
  </g>
  <rect x="40" y="40" width="320" height="230" fill="none" stroke="#3a6a1c" stroke-width="2" rx="3"/>
  <text x="200" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8f5d0" opacity="0.8">Patch A</text>

  <!-- ── Patch B: top-right ── -->
  <rect x="440" y="40" width="320" height="230" fill="#6b9e45" rx="3"/>
  <g stroke="#5a8a35" stroke-width="1.5" opacity="0.5">
    <line x1="440" y1="65" x2="760" y2="65"/>
    <line x1="440" y1="90" x2="760" y2="90"/>
    <line x1="440" y1="115" x2="760" y2="115"/>
    <line x1="440" y1="140" x2="760" y2="140"/>
    <line x1="440" y1="165" x2="760" y2="165"/>
    <line x1="440" y1="190" x2="760" y2="190"/>
    <line x1="440" y1="215" x2="760" y2="215"/>
    <line x1="440" y1="240" x2="760" y2="240"/>
  </g>
  <rect x="440" y="40" width="320" height="230" fill="none" stroke="#4a7a25" stroke-width="2" rx="3"/>
  <text x="600" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8f5d0" opacity="0.8">Patch B</text>

  <!-- ── Horizontal main path (middle) ── -->
  <!-- path from x=40 to x=760, y=290 to y=320 — already the gap between patches -->
  <!-- The gap between top patches (y=270) and bottom patches (y=330) is the path -->

  <!-- ── Patch C: bottom-left ── -->
  <rect x="40" y="330" width="200" height="230" fill="#4e7d35" rx="3"/>
  <g stroke="#3e6d25" stroke-width="1.5" opacity="0.5">
    <line x1="40" y1="355" x2="240" y2="355"/>
    <line x1="40" y1="380" x2="240" y2="380"/>
    <line x1="40" y1="405" x2="240" y2="405"/>
    <line x1="40" y1="430" x2="240" y2="430"/>
    <line x1="40" y1="455" x2="240" y2="455"/>
    <line x1="40" y1="480" x2="240" y2="480"/>
    <line x1="40" y1="505" x2="240" y2="505"/>
    <line x1="40" y1="530" x2="240" y2="530"/>
  </g>
  <rect x="40" y="330" width="200" height="230" fill="none" stroke="#2e5d15" stroke-width="2" rx="3"/>
  <text x="140" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8f5d0" opacity="0.8">Patch C</text>

  <!-- ── Patch D: bottom-center ── -->
  <rect x="300" y="330" width="200" height="230" fill="#5c8a3e" rx="3"/>
  <g stroke="#4c7a2e" stroke-width="1.5" opacity="0.5">
    <line x1="300" y1="355" x2="500" y2="355"/>
    <line x1="300" y1="380" x2="500" y2="380"/>
    <line x1="300" y1="405" x2="500" y2="405"/>
    <line x1="300" y1="430" x2="500" y2="430"/>
    <line x1="300" y1="455" x2="500" y2="455"/>
    <line x1="300" y1="480" x2="500" y2="480"/>
    <line x1="300" y1="505" x2="500" y2="505"/>
    <line x1="300" y1="530" x2="500" y2="530"/>
  </g>
  <rect x="300" y="330" width="200" height="230" fill="none" stroke="#3c6a1e" stroke-width="2" rx="3"/>
  <text x="400" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8f5d0" opacity="0.8">Patch D</text>

  <!-- ── Patch E: bottom-right ── -->
  <rect x="560" y="330" width="200" height="230" fill="#638f42" rx="3"/>
  <g stroke="#537f32" stroke-width="1.5" opacity="0.5">
    <line x1="560" y1="355" x2="760" y2="355"/>
    <line x1="560" y1="380" x2="760" y2="380"/>
    <line x1="560" y1="405" x2="760" y2="405"/>
    <line x1="560" y1="430" x2="760" y2="430"/>
    <line x1="560" y1="455" x2="760" y2="455"/>
    <line x1="560" y1="480" x2="760" y2="480"/>
    <line x1="560" y1="505" x2="760" y2="505"/>
    <line x1="560" y1="530" x2="760" y2="530"/>
  </g>
  <rect x="560" y="330" width="200" height="230" fill="none" stroke="#436022" stroke-width="2" rx="3"/>
  <text x="660" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8f5d0" opacity="0.8">Patch E</text>

  <!-- ── Path edge highlights (worn stones) ── -->
  <g fill="#d4c4a0" opacity="0.4">
    <!-- horizontal center path stones -->
    <rect x="50" y="278" width="30" height="8" rx="4"/>
    <rect x="95" y="280" width="40" height="7" rx="3"/>
    <rect x="150" y="276" width="25" height="9" rx="4"/>
    <rect x="190" y="281" width="35" height="7" rx="3"/>
    <rect x="240" y="278" width="28" height="8" rx="4"/>
    <rect x="285" y="280" width="32" height="7" rx="3"/>
    <rect x="330" y="276" width="38" height="9" rx="4"/>
    <rect x="385" y="281" width="25" height="7" rx="3"/>
    <rect x="425" y="278" width="30" height="8" rx="4"/>
    <rect x="470" y="280" width="40" height="7" rx="3"/>
    <rect x="525" y="276" width="28" height="9" rx="4"/>
    <rect x="570" y="281" width="35" height="7" rx="3"/>
    <rect x="620" y="278" width="30" height="8" rx="4"/>
    <rect x="665" y="280" width="38" height="7" rx="3"/>
    <rect x="718" y="276" width="28" height="9" rx="4"/>
    <!-- vertical path stones between bottom patches -->
    <rect x="252" y="340" width="8" height="25" rx="4"/>
    <rect x="254" y="380" width="7" height="30" rx="3"/>
    <rect x="251" y="425" width="9" height="22" rx="4"/>
    <rect x="253" y="462" width="7" height="28" rx="3"/>
    <rect x="252" y="500" width="8" height="20" rx="4"/>
    <rect x="512" y="340" width="8" height="25" rx="4"/>
    <rect x="514" y="380" width="7" height="30" rx="3"/>
    <rect x="511" y="425" width="9" height="22" rx="4"/>
    <rect x="513" y="462" width="7" height="28" rx="3"/>
    <rect x="512" y="500" width="8" height="20" rx="4"/>
    <!-- vertical path between top and bottom -->
    <rect x="372" y="290" width="8" height="18" rx="4"/>
    <rect x="374" y="313" width="7" height="14" rx="3"/>
  </g>
</svg>